<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do list</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="app">
      <input type="text" value="whatever" ref="inputan"><br>
      <input type="text" :value="count" ref="hitungan">
      <button @click="count++">add</button>
      </div>
    </div>
    <script type="module">
      import { createApp } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";
      createApp({
        data() {
          return {
            message: 'hello word',
            count: 0
          };
        },
        beforeCreate() {
          console.log(`before create : ${this.message}`)
        },
        created() {
          console.log(`create: ${this.message}`)
        },
        beforeMount() {
          console.log(`before mount: ${this.$refs.inputan}`)  
        },
        mounted() {
          console.log(`mounted: ${this.$refs.inputan.value}`)
        },
        beforeUpdate() {
          console.log(`before update: ${this.$refs.hitungan.value}`)
        },
        updated() {  
          console.log(`update: ${this.$refs.hitungan.value}`)
        },
      }).mount("#app");
    </script>
  </body>
</html>
